[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "nano-vLLM fork with JetSpec paged tree speculative decoding and continuous batching"
# Serving error/cleanup diagnostics use BaseException.add_note (Python 3.11+).
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.8,<2.9",
    "triton>=3.4,<3.5",
    "transformers>=4.57.1,<4.58",
    "xxhash",
    "tqdm",
    "safetensors",
]

[project.optional-dependencies]
# The trained head/cache adapter relies on this source revision, not merely
# the published package version (0.0.1). Do not silently follow upstream main.
jetspec = [
    "jetspec @ git+https://github.com/hao-ai-lab/JetSpec.git@2c7b3fae75690dfe9a188a37d7fdfd43ee0e032f",
]
# Optional: the qualified JetSpec environment uses PyTorch SDPA, not this extra.
# Install CUDA/PyTorch and the compiler/build dependencies before requesting it.
flash-attn = ["flash-attn>=2.7,<3"]

[project.urls]
Homepage="https://github.com/chougou0811/nano-vllm-jetspec"
Repository="https://github.com/chougou0811/nano-vllm-jetspec"
Upstream="https://github.com/GeeeekExplorer/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
